# -----------------------------------------------------------------------------
# Refresh the voice list from the Phonon voice catalog (gradium/phonon-voices).
#
# Runs `npm run sync-voices`, which pins the catalog to its latest commit and
# rewrites src/voices.catalog.json, the `voice` options of the manifest and
# site/voices.json. When something changed, the result is committed to the
# branch the workflow runs on; release a new version afterwards so Gladys
# offers the new voices.
# -----------------------------------------------------------------------------
name: Sync voices

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Catalog revision (branch, tag or commit)'
        required: false
        default: 'main'

permissions:
  contents: write # commit the refreshed voice list

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync the voice list
        env:
          REVISION: ${{ inputs.revision }}
        run: npm run sync-voices -- "$REVISION"

      - name: Run the tests
        run: npm test

      - name: Commit the changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The voice list is up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/voices.catalog.json gladys-assistant-integration.json site/voices.json
          git commit -m "chore(voices): sync the Phonon voice catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
